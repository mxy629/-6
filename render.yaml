# Render 一键部署配置 —— 成长星球后端
# 使用方式：Render 后台 New → Blueprint → 连接 GitHub 仓库 → 选用本文件
services:
  - type: web
    name: growth-planet-server
    runtime: docker
    plan: free
    branch: main
    rootDir: ./apps/server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: mock
