<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>打卡星球 · 小程序预览（连接本地后端）</title>
<style>
  :root{
    --green:#4CAF50; --green-d:#388E3C; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --bg:#F5F7FA; --card:#fff; --blue:#2563eb; --amber:#d97706;
    --red:#dc2626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#dfe3ea;color:var(--ink)}
  .phone{width:390px;min-height:780px;margin:18px auto;background:var(--bg);border-radius:34px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.18);display:flex;flex-direction:column;position:relative}
  .statusbar{height:34px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13px;font-weight:600}
  .nav{height:46px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;position:relative}
  .nav .back{position:absolute;left:12px;font-size:22px;cursor:pointer;line-height:1}
  .screen{flex:1;overflow-y:auto;padding:14px}
  .screen::-webkit-scrollbar{width:0}
  .tabbar{height:58px;background:#fff;border-top:1px solid var(--line);display:flex}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);cursor:pointer;gap:2px}
  .tab.active{color:var(--green);font-weight:700}
  .tab .ic{font-size:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .row{display:flex;align-items:center;justify-content:space-between}
  .muted{color:var(--muted);font-size:13px}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:999px;background:#eef2f7;color:var(--muted)}
  .pill.green{background:#e7f6e9;color:var(--green-d)}
  .pill.amber{background:#fdf2e2;color:var(--amber)}
  .pill.blue{background:#e7eefe;color:var(--blue)}
  .pill.red{background:#fdeaea;color:var(--red)}
  .pts{font-size:26px;font-weight:800;color:var(--green)}
  .btn{display:block;width:100%;border:none;border-radius:12px;background:var(--green);color:#fff;font-size:15px;font-weight:600;padding:12px;cursor:pointer;margin-top:8px}
  .btn:active{background:var(--green-d)}
  .btn.ghost{background:#fff;color:var(--green-d);border:1px solid var(--green)}
  .btn.amber{background:var(--amber)}
  .btn.red{background:var(--red)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .title{font-size:16px;font-weight:700;margin:2px 0 10px}
  .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
  input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;margin:6px 0;font-family:inherit;background:#fff}
  .seg{display:flex;background:#eef2f7;border-radius:10px;padding:3px;margin:8px 0}
  .seg div{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
  .seg div.on{background:#fff;color:var(--green-d);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.82);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;max-width:78%;text-align:center;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .hidden{display:none}
  .rolebadge{position:absolute;right:12px;top:8px;font-size:11px;background:rgba(255,255,255,.25);padding:2px 8px;border-radius:999px}
  .hero{background:linear-gradient(135deg,var(--green),#66bb6a);color:#fff;border-radius:16px;padding:18px;margin-bottom:12px}
  .hero .big{font-size:30px;font-weight:800}
  .empty{text-align:center;color:var(--muted);padding:30px 0;font-size:14px}
  .tip{font-size:12px;color:var(--muted);background:#fff7e6;border:1px solid #ffe0a3;border-radius:10px;padding:10px;margin-bottom:12px;line-height:1.5}
  .seg.sm{margin:10px 0}
  .devcode{font-size:12px;color:var(--red);font-weight:600;margin:4px 0 8px;min-height:14px}
  .lg-title{text-align:center;font-size:20px;font-weight:800;margin:18px 0 4px}
  .lg-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px}
  .chip{display:inline-block;background:#eef2f7;border-radius:8px;padding:6px 10px;margin:4px 4px 0 0;font-size:13px;cursor:pointer}
  .chip.on{background:var(--green);color:#fff}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><span>打卡星球</span></div>
  <div class="nav"><span class="back hidden" id="navBack">‹</span><span id="navTitle">成长星球</span><span class="rolebadge" id="roleBadge"></span></div>
  <div class="screen" id="screen"></div>
  <div class="tabbar" id="tabbar"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
// 同源部署时走相对路径；从外部静态服务器打开时回退到 localhost:3000
const BASE = (window.location.port === '3000' || window.location.port === '') ? '/api/v1' : 'http://localhost:3000/api/v1';
let token = null, me = null, role = null, childId = null;

async function api(method, path, body){
  const res = await fetch(BASE+path, {
    method, headers:{'Content-Type':'application/json', ...(token?{Authorization:'Bearer '+token}:{})},
    body: body? JSON.stringify(body): undefined
  });
  const json = await res.json().catch(()=>({success:false,message:'响应解析失败'}));
  if(res.ok && json && json.success) return json.data;
  if(res.status===401){ toast('登录已失效，请重新登录'); token=null; role=null; render(); throw new Error(json?.message||'未登录'); }
  throw new Error(json?.message || ('请求失败 ('+res.status+')'));
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }
function fmt(n){ return (n>=0?'+':'')+n; }
const STATUS = {PENDING:{t:'待完成',c:'blue'},SUBMITTED:{t:'待审核',c:'amber'},APPROVED:{t:'已通过',c:'green'},REJECTED:{t:'已驳回',c:'red'},ACTIVE:{t:'进行中',c:'green'},INACTIVE:{t:'已下架',c:'amber'},PENDING2:{},APPROVED2:{},REJECTED2:{},FULFILLED:{t:'已完成',c:'green'}};

/* ---------- 路由 / 屏幕 ---------- */
const screens = {
  login: renderLogin,
  childHome: renderChildHome, childTasks: renderChildTasks, childPoints: renderChildPoints, childRewards: renderChildRewards, childSubmitForm: renderChildSubmitForm,
  parentHome: renderParentHome, parentTasks: renderParentTasks, parentReviews: renderParentReviews,
  parentRewards: renderParentRewards, parentRedemptions: renderParentRedemptions,
};
let current = 'login';
function go(name){ current=name; render(); }
function render(){
  document.getElementById('roleBadge').textContent = role? (role==='PARENT'?'家长端':'孩子端') : '';
  document.getElementById('navBack').classList.toggle('hidden', current==='login');
  document.getElementById('tabbar').innerHTML = tabbarHtml();
  document.getElementById('tabbar').classList.toggle('hidden', !role);
  screens[current]();
}
function tabbarHtml(){
  if(role==='CHILD'){
    return `
      <div class="tab ${current==='childHome'?'active':''}" onclick="go('childHome')"><div class="ic">🏠</div>首页</div>
      <div class="tab ${current==='childTasks'?'active':''}" onclick="go('childTasks')"><div class="ic">📋</div>任务</div>
      <div class="tab ${current==='childRewards'?'active':''}" onclick="go('childRewards')"><div class="ic">🎁</div>奖励</div>
      <div class="tab ${current==='childPoints'?'active':''}" onclick="go('childPoints')"><div class="ic">⭐</div>积分</div>`;
  }
  if(role==='PARENT'){
    return `
      <div class="tab ${current==='parentHome'?'active':''}" onclick="go('parentHome')"><div class="ic">🏠</div>首页</div>
      <div class="tab ${current==='parentTasks'?'active':''}" onclick="go('parentTasks')"><div class="ic">📋</div>任务</div>
      <div class="tab ${current==='parentReviews'?'active':''}" onclick="go('parentReviews')"><div class="ic">✅</div>审核</div>
      <div class="tab ${current==='parentRewards'?'active':''}" onclick="go('parentRewards')"><div class="ic">🎁</div>奖励</div>`;
  }
  return '';
}

/* ---------- 登录 ---------- */
function renderLogin(){
  setNav('成长星球 · 登录');
  document.getElementById('screen').innerHTML = `
    <div class="lg-title">🪐 打卡星球</div>
    <div class="lg-sub">家长-孩子 任务积分奖励闭环</div>
    <div class="seg" id="roleSeg">
      <div class="on" data-r="PARENT">我是家长</div>
      <div data-r="CHILD">我是孩子</div>
    </div>
    <div class="tip">演示账号已内置：<br/>· 家长：微信登录（开发码 <b>seed_parent</b>）/ 或手机号注册登录<br/>· 孩子：账号 <b>xiaoyu</b> / PIN <b>2580</b></div>
    <div id="parentForm">
      <div class="seg sm" id="pModeSeg">
        <div class="on" data-m="wechat">微信</div>
        <div data-m="phoneLogin">手机登录</div>
        <div data-m="register">注册</div>
      </div>
      <div id="pWechat" class="card">
        <div class="title">家长微信登录</div>
        <div class="sub">开发环境用 code 模拟微信 openid</div>
        <input id="pcode" value="seed_parent" placeholder="微信登录 code"/>
        <button class="btn" onclick="doParentLogin()">微信一键登录</button>
      </div>
      <div id="pPhoneLogin" class="card hidden">
        <div class="title">手机号登录</div>
        <input id="pl_phone" placeholder="手机号（11 位）"/>
        <div class="row" style="gap:8px">
          <input id="pl_code" placeholder="6 位验证码" style="flex:1"/>
          <button class="btn ghost" style="width:auto" onclick="sendCode('LOGIN','pl_phone','pl_devcode')">获取验证码</button>
        </div>
        <div class="devcode" id="pl_devcode"></div>
        <button class="btn" onclick="doPhoneLogin()">登录</button>
      </div>
      <div id="pRegister" class="card hidden">
        <div class="title">注册家长账号</div>
        <input id="rg_nick" placeholder="昵称（选填）" value="新家长"/>
        <input id="rg_phone" placeholder="手机号（11 位）"/>
        <div class="row" style="gap:8px">
          <input id="rg_code" placeholder="6 位验证码" style="flex:1"/>
          <button class="btn ghost" style="width:auto" onclick="sendCode('REGISTER','rg_phone','rg_devcode')">获取验证码</button>
        </div>
        <div class="devcode" id="rg_devcode"></div>
        <button class="btn" onclick="doRegister()">注册并登录</button>
      </div>
    </div>
    <div id="childForm" class="card hidden">
      <div class="title">孩子登录</div>
      <input id="clogin" value="xiaoyu" placeholder="登录账号"/>
      <input id="cpin" value="2580" placeholder="PIN 码" type="password"/>
      <button class="btn" onclick="doChildLogin()">登录</button>
    </div>`;
  document.querySelectorAll('#roleSeg div').forEach(d=>d.onclick=()=>{
    document.querySelectorAll('#roleSeg div').forEach(x=>x.classList.remove('on'));
    d.classList.add('on');
    const r=d.dataset.r;
    document.getElementById('parentForm').classList.toggle('hidden', r!=='PARENT');
    document.getElementById('childForm').classList.toggle('hidden', r!=='CHILD');
  });
  document.querySelectorAll('#pModeSeg div').forEach(d=>d.onclick=()=>{
    document.querySelectorAll('#pModeSeg div').forEach(x=>x.classList.remove('on'));
    d.classList.add('on');
    const m=d.dataset.m;
    document.getElementById('pWechat').classList.toggle('hidden', m!=='wechat');
    document.getElementById('pPhoneLogin').classList.toggle('hidden', m!=='phoneLogin');
    document.getElementById('pRegister').classList.toggle('hidden', m!=='register');
  });
}
async function sendCode(purpose, phoneId, devId){
  const phone=document.getElementById(phoneId).value.trim();
  try{
    const d=await api('POST','/auth/send-code',{phone,purpose});
    document.getElementById(devId).textContent = d.devCode ? ('开发验证码：'+d.devCode) : '';
    toast('验证码已发送'+(d.devCode?'（见下方）':''));
  }catch(e){ toast(e.message); }
}
async function doParentLogin(){
  const code=document.getElementById('pcode').value.trim();
  try{ const d=await api('POST','/auth/wechat',{code}); token=d.accessToken; me=d.user; role='PARENT'; childId=me.id; toast('家长登录成功'); go('parentHome'); }
  catch(e){ toast(e.message); }
}
async function doPhoneLogin(){
  const phone=document.getElementById('pl_phone').value.trim();
  const code=document.getElementById('pl_code').value.trim();
  try{ const d=await api('POST','/auth/phone-login',{phone,code}); token=d.accessToken; me=d.user; role='PARENT'; childId=me.id; toast('手机号登录成功'); go('parentHome'); }
  catch(e){ toast(e.message); }
}
async function doRegister(){
  const phone=document.getElementById('rg_phone').value.trim();
  const code=document.getElementById('rg_code').value.trim();
  const nickname=document.getElementById('rg_nick').value.trim();
  try{ const d=await api('POST','/auth/register',{phone,code,nickname}); token=d.accessToken; me=d.user; role='PARENT'; childId=me.id; toast('注册成功'); go('parentHome'); }
  catch(e){ toast(e.message); }
}
async function doChildLogin(){
  const loginName=document.getElementById('clogin').value.trim();
  const pin=document.getElementById('cpin').value.trim();
  try{ const d=await api('POST','/auth/child-login',{loginName,pin}); token=d.accessToken; me=d.user; role='CHILD'; childId=me.id; toast('孩子登录成功'); go('childHome'); }
  catch(e){ toast(e.message); }
}
function doLogout(){
  token=null; me=null; role=null; childId=null;
  toast('已退出登录'); go('login');
}

/* ---------- 孩子端 ---------- */
function renderChildHome(){
  setNav('成长星球');
  (async()=>{
    try{
      const bal=await api('GET','/points/balance');
      const today=await api('GET','/child/tasks/today');
      const done=today.filter(t=>['APPROVED','REJECTED'].includes(t.status)).length;
      document.getElementById('screen').innerHTML=`
        <div class="hero">
          <div class="muted" style="color:rgba(255,255,255,.85)">你好，${me.nickname||'小朋友'} 👋</div>
          <div class="big">${bal.balance} <span style="font-size:14px;font-weight:500">积分</span></div>
          <div style="font-size:13px;opacity:.9;margin-top:4px">今日任务 ${today.length} 项 · 已完成 ${done} 项</div>
        </div>
        <div class="card" onclick="go('childTasks')" style="cursor:pointer">
          <div class="row"><span class="title" style="margin:0">📋 今日任务</span><span class="muted">查看 ›</span></div>
        </div>
        <div class="card" onclick="go('childRewards')" style="cursor:pointer">
          <div class="row"><span class="title" style="margin:0">🎁 奖励商店</span><span class="muted">去兑换 ›</span></div>
        </div>
        <button class="btn ghost" onclick="doLogout()">退出登录 / 切换账号</button>`;
    }catch(e){}
  })();
}
async function renderChildTasks(){
  setNav('我的任务');
  const el=document.getElementById('screen');
  el.innerHTML=`<div class="sub">加载中…</div>`;
  try{
    const list=await api('GET','/child/tasks/today');
    if(!list.length){ el.innerHTML=`<div class="empty">今天还没有任务～</div>`; return; }
    el.innerHTML=list.map(t=>{
      const s=STATUS[t.status]||{t:t.status,c:''};
      return `<div class="card">
        <div class="row"><b>${t.task.title}</b><span class="pill ${s.c}">${s.t}</span></div>
        <div class="muted" style="margin:4px 0">${t.task.description||'—'} · 奖励 <b style="color:var(--green)">+${t.task.rewardPoints}</b> 分</div>
        ${t.status==='PENDING'?`<button class="btn" onclick="childSubmit('${t.id}')">完成任务 · 提交证明</button>`:''}
        ${t.status==='SUBMITTED'?`<div class="pill amber">等待家长审核中…</div>`:''}
      </div>`;
    }).join('');
  }catch(e){ el.innerHTML=`<div class="empty">${e.message}</div>`; }
}
let submitInstanceId=null;
async function childSubmit(instanceId){ submitInstanceId=instanceId; go('childSubmitForm'); }
function renderChildSubmitForm(){
  setNav('提交完成证明');
  document.getElementById('screen').innerHTML=`
    <div class="sub">把完成情况告诉家长（演示版仅文字，图片可忽略）</div>
    <textarea id="proofText" rows="4" placeholder="例如：我读了20分钟书，读完了一章"></textarea>
    <button class="btn" onclick="childDoSubmit()">提交给家长审核</button>
    <button class="btn ghost" onclick="go('childTasks')">取消</button>`;
}
async function childDoSubmit(){
  const proof=document.getElementById('proofText').value.trim();
  try{ await api('POST',`/task-instances/${submitInstanceId}/submit`,{textProof:proof,images:[]}); toast('已提交，等待家长审核'); go('childTasks'); }
  catch(e){ toast(e.message); }
}
async function renderChildPoints(){
  setNav('我的积分');
  const el=document.getElementById('screen');
  try{
    const bal=await api('GET','/points/balance');
    const ledger=await api('GET','/points/ledger');
    el.innerHTML=`<div class="hero"><div class="muted" style="color:rgba(255,255,255,.85)">当前积分</div><div class="big">${bal.balance}</div></div>`+
      (ledger.length? ledger.map(l=>{
        const c=l.amount>0?'green':'red';
        return `<div class="card"><div class="row"><div><div>${l.description||l.bizType}</div><div class="muted">${new Date(l.createdAt).toLocaleString('zh-CN')}</div></div><div class="pts" style="color:${l.amount>0?'var(--green)':'var(--red)'}">${fmt(l.amount)}</div></div></div>`;
      }).join('') : `<div class="empty">暂无记录</div>`);
  }catch(e){ el.innerHTML=`<div class="empty">${e.message}</div>`; }
}
async function renderChildRewards(){
  setNav('奖励商店');
  const el=document.getElementById('screen');
  el.innerHTML=`<div class="sub">加载中…</div>`;
  try{
    const list=await api('GET','/child/rewards');
    const bal=await api('GET','/points/balance');
    if(!list.length){ el.innerHTML=`<div class="empty">暂无奖励</div>`; return; }
    el.innerHTML=list.map(r=>{
      const can=r.status==='ACTIVE'&&r.stock>0&&bal.balance>=r.pointsCost;
      return `<div class="card">
        <div class="row"><b>${r.name}</b><span class="pill ${r.status==='ACTIVE'?'green':'amber'}">${r.status==='ACTIVE'?'可兑换':'已下架'}</span></span></div>
        <div class="muted" style="margin:4px 0">${r.description||'—'}</div>
        <div class="row"><span class="pts">${r.pointsCost} 分</span><span class="pill">库存 ${r.stock}</span></div>
        <button class="btn ${can?'':'ghost'}" ${can?'':'disabled'} onclick="childRedeem('${r.id}','${r.name}')">${bal.balance>=r.pointsCost?(r.stock>0?'兑换':'库存不足'):'积分不足'}</button>
      </div>`;
    }).join('');
  }catch(e){ el.innerHTML=`<div class="empty">${e.message}</div>`; }
}
async function childRedeem(id,name){
  try{ await api('POST',`/rewards/${id}/redeem`); toast('兑换成功，等待家长确认'); go('childRewards'); }
  catch(e){ toast(e.message); }
}

/* ---------- 家长端 ---------- */
function renderParentHome(){
  setNav('成长星球');
  (async()=>{
    try{
      const children=await api('GET','/children');
      const reviews=await api('GET','/reviews/tasks');
      const reds=await api('GET','/redemptions');
      const pendingRev=reviews.filter(r=>r.status==='SUBMITTED').length;
      const pendingRed=reds.filter(r=>r.status==='PENDING').length;
      const child=children[0];
      if(child) childId=child.id;
      document.getElementById('screen').innerHTML=`
        <div class="hero"><div class="muted" style="color:rgba(255,255,255,.85)">家长工作台</div>
          <div class="big" style="font-size:20px">${me.nickname||'家长'} 你好 👋</div></div>
        ${child?`<div class="card"><div class="row"><span>👦 ${child.nickname}</span><span class="pill green">${child.pointsBalance} 分</span></div></div>`:''}
        <div class="card" onclick="go('parentReviews')" style="cursor:pointer"><div class="row"><span class="title" style="margin:0">✅ 待审核任务</span><span class="pill amber">${pendingRev} 项 ›</span></div></div>
        <div class="card" onclick="go('parentRedemptions')" style="cursor:pointer"><div class="row"><span class="title" style="margin:0">🎁 待确认兑换</span><span class="pill amber">${pendingRed} 项 ›</span></div></div>
        <div class="card" onclick="go('parentTasks')" style="cursor:pointer"><div class="row"><span class="title" style="margin:0">📋 发布 / 管理任务</span><span class="muted">›</span></div></div>
        <button class="btn ghost" onclick="doLogout()">退出登录 / 切换账号</button>`;
    }catch(e){}
  })();
}
async function renderParentTasks(){
  setNav('任务管理');
  const el=document.getElementById('screen');
  el.innerHTML=`
    <div class="card">
      <div class="title">➕ 发布新任务</div>
      <input id="t_title" placeholder="任务标题（如：阅读20分钟）"/>
      <input id="t_points" placeholder="奖励积分（如：20）" type="number"/>
      <div class="seg" id="t_type"><div class="on" data-v="STUDY">学习</div><div data-v="HOUSEWORK">家务</div><div data-v="SPORT">运动</div><div data-v="OTHER">其他</div></div>
      <button class="btn" onclick="parentCreateTask()">发布给当前孩子</button>
    </div>
    <div id="taskList"><div class="sub">加载中…</div></div>`;
  loadParentTasks();
}
let _taskType='STUDY';
async function loadParentTasks(){
  try{
    const list=await api('GET','/tasks');
    const el=document.getElementById('taskList');
    if(!list.length){ el.innerHTML=`<div class="empty">还没有任务</div>`; return; }
    el.innerHTML=list.map(t=>`<div class="card"><div class="row"><b>${t.title}</b><span class="pill green">+${t.rewardPoints}</span></div><div class="muted">${t.taskType} · ${t.status==='ACTIVE'?'进行中':'已停用'}</div></div>`).join('');
  }catch(e){}
}
async function parentCreateTask(){
  const title=document.getElementById('t_title').value.trim();
  const rewardPoints=parseInt(document.getElementById('t_points').value,10);
  if(!title||!rewardPoints){ toast('请填写标题和积分'); return; }
  try{ await api('POST','/tasks',{childId,title,rewardPoints,taskType:_taskType,repeatType:'NONE'}); toast('任务已发布'); document.getElementById('t_title').value=''; document.getElementById('t_points').value=''; loadParentTasks(); }
  catch(e){ toast(e.message); }
}
async function renderParentReviews(){
  setNav('任务审核');
  const el=document.getElementById('screen');
  el.innerHTML=`<div class="sub">加载中…</div>`;
  try{
    const list=await api('GET','/reviews/tasks');
    if(!list.length){ el.innerHTML=`<div class="empty">暂无待审核任务</div>`; return; }
    el.innerHTML=list.map(r=>{
      const s=STATUS[r.status]||{t:r.status,c:''};
      return `<div class="card">
        <div class="row"><b>${r.task?.title||'任务'}</b><span class="pill ${s.c}">${s.t}</span></div>
        ${r.submissions&&r.submissions[0]?`<div class="muted" style="margin:6px 0">📝 ${r.submissions[0].textProof||'(无文字)'}</div>`:''}
        ${r.status==='SUBMITTED'?`<button class="btn" onclick="parentApprove('${r.id}')">通过 · 发放积分</button><button class="btn red" onclick="parentReject('${r.id}')">驳回</button>`:''}
      </div>`;
    }).join('');
  }catch(e){ el.innerHTML=`<div class="empty">${e.message}</div>`; }
}
async function parentApprove(id){
  try{ await api('POST',`/task-instances/${id}/approve`); toast('已通过，积分已发放'); renderParentReviews(); }
  catch(e){ toast(e.message); }
}
async function parentReject(id){
  try{ await api('POST',`/task-instances/${id}/reject`,{reason:'需补充证明'}); toast('已驳回'); go('parentReviews'); }
  catch(e){ toast(e.message); }
}
let editingRewardId=null;
async function renderParentRewards(){
  editingRewardId=null;
  setNav('奖励管理');
  const el=document.getElementById('screen');
  el.innerHTML=`
    <div class="tip">新建奖励先存为<b>草稿</b>，点「上架」后孩子端才可见；<b>任意状态下都能编辑</b>（读取当前数据改后保存）。</div>
    <div class="card">
      <div class="title" id="rwFormTitle">➕ 新增奖励（存为草稿）</div>
      <input id="r_name" placeholder="奖励名称（如：看电影一次）"/>
      <input id="r_cost" placeholder="所需积分（如：200）" type="number"/>
      <input id="r_stock" placeholder="库存（如：5）" type="number"/>
      <button class="btn" id="rwSubmitBtn" onclick="parentSubmitReward()">保存为草稿</button>
      <button class="btn ghost" id="rwCancelBtn" onclick="cancelEditReward()" style="display:none">取消编辑</button>
    </div>
    <div id="rewardList"><div class="sub">加载中…</div></div>`;
  loadParentRewards();
}
async function loadParentRewards(){
  try{
    const list=await api('GET','/rewards');
    const el=document.getElementById('rewardList');
    if(!list.length){ el.innerHTML=`<div class="empty">还没有奖励</div>`; return; }
    el.innerHTML=list.map(r=>{
      const label=r.status==='ACTIVE'?'上架中':r.status==='INACTIVE'?'已下架':'草稿';
      const pillc=r.status==='ACTIVE'?'green':r.status==='INACTIVE'?'amber':'';
      let actions=`<button class="btn ghost" onclick="editReward('${r.id}')">编辑</button>`;
      if(r.status==='ACTIVE'){
        actions+=`<button class="btn ghost" onclick="unpublishReward('${r.id}')">下架</button>`;
      } else {
        actions+=`<button class="btn" onclick="publishReward('${r.id}')">上架</button>`;
      }
      return `<div class="card"><div class="row"><b>${r.name}</b><span class="pill ${pillc}">${label}</span></div>
        <div class="muted">${r.pointsCost} 分 · 库存 ${r.stock}</div>
        <div class="row" style="margin-top:8px;gap:8px">${actions}</div></div>`;
    }).join('');
  }catch(e){}
}
async function parentSubmitReward(){
  const name=document.getElementById('r_name').value.trim();
  const pointsCost=parseInt(document.getElementById('r_cost').value,10);
  const stock=parseInt(document.getElementById('r_stock').value,10)||0;
  if(!name||!pointsCost){ toast('请填写名称和积分'); return; }
  try{
    if(editingRewardId){
      await api('PATCH',`/rewards/${editingRewardId}`,{name,pointsCost,stock});
      toast('已保存修改');
    } else {
      await api('POST','/rewards',{name,pointsCost,stock});
      toast('已存为草稿，记得上架');
    }
    document.getElementById('r_name').value='';document.getElementById('r_cost').value='';document.getElementById('r_stock').value='';
    editingRewardId=null;
    document.getElementById('rwFormTitle').textContent='➕ 新增奖励（存为草稿）';
    document.getElementById('rwSubmitBtn').textContent='保存为草稿';
    document.getElementById('rwCancelBtn').style.display='none';
    loadParentRewards();
  }catch(e){ toast(e.message); }
}
async function publishReward(id){
  try{ await api('POST',`/rewards/${id}/publish`); toast('已上架，孩子端可见'); loadParentRewards(); }
  catch(e){ toast(e.message); }
}
async function unpublishReward(id){
  try{ await api('DELETE',`/rewards/${id}`); toast('已下架'); loadParentRewards(); }
  catch(e){ toast(e.message); }
}
async function editReward(id){
  try{
    const r=await api('GET',`/rewards/${id}`);
    editingRewardId=id;
    document.getElementById('r_name').value=r.name;
    document.getElementById('r_cost').value=r.pointsCost;
    document.getElementById('r_stock').value=r.stock;
    document.getElementById('rwFormTitle').textContent='✏️ 编辑奖励（随时可改）';
    document.getElementById('rwSubmitBtn').textContent='保存修改';
    document.getElementById('rwCancelBtn').style.display='inline-block';
    toast('已填入表单，修改后保存');
  }catch(e){ toast(e.message); }
}
function cancelEditReward(){
  editingRewardId=null;
  document.getElementById('r_name').value='';document.getElementById('r_cost').value='';document.getElementById('r_stock').value='';
  document.getElementById('rwFormTitle').textContent='➕ 新增奖励（存为草稿）';
  document.getElementById('rwSubmitBtn').textContent='保存为草稿';
  document.getElementById('rwCancelBtn').style.display='none';
}
async function renderParentRedemptions(){
  setNav('兑换确认');
  const el=document.getElementById('screen');
  el.innerHTML=`<div class="sub">加载中…</div>`;
  try{
    const list=await api('GET','/redemptions');
    if(!list.length){ el.innerHTML=`<div class="empty">暂无兑换记录</div>`; return; }
    el.innerHTML=list.map(r=>{
      const s=STATUS[r.status]||{t:r.status,c:''};
      return `<div class="card">
        <div class="row"><b>${r.reward?.name||'奖励'}</b><span class="pill ${s.c}">${s.t}</span></div>
        <div class="muted" style="margin:4px 0">👦 ${r.child?.nickname||''} · ${r.pointsCost} 分</div>
        ${r.status==='PENDING'?`<button class="btn" onclick="parentApproveRed('${r.id}')">确认兑换</button><button class="btn red" onclick="parentRejectRed('${r.id}')">拒绝（退积分）</button>`:''}
        ${r.status==='APPROVED'?`<button class="btn amber" onclick="parentFulfillRed('${r.id}')">标记已发放</button>`:''}
      </div>`;
    }).join('');
  }catch(e){ el.innerHTML=`<div class="empty">${e.message}</div>`; }
}
async function parentApproveRed(id){ try{ await api('POST',`/redemptions/${id}/approve`); toast('已确认'); renderParentRedemptions(); }catch(e){ toast(e.message);} }
async function parentRejectRed(id){ try{ await api('POST',`/redemptions/${id}/reject`); toast('已拒绝，积分退回'); renderParentRedemptions(); }catch(e){ toast(e.message);} }
async function parentFulfillRed(id){ try{ await api('POST',`/redemptions/${id}/fulfill`); toast('已标记发放'); renderParentRedemptions(); }catch(e){ toast(e.message);} }

/* 任务类型选择 */
document.addEventListener('click',e=>{
  if(e.target.closest('#t_type')){
    const d=e.target.closest('#t_type div'); if(!d) return;
    document.querySelectorAll('#t_type div').forEach(x=>x.classList.remove('on'));
    d.classList.add('on'); _taskType=d.dataset.v;
  }
});

function setNav(t){ document.getElementById('navTitle').textContent=t; }
document.getElementById('navBack').onclick=()=>{ if(current==='childSubmitForm'){ go('childTasks'); return; } if(role==='PARENT') go('parentHome'); else if(role==='CHILD') go('childHome'); };
render();
</script>
</body>
</html>
